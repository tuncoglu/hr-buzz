// HR Buzz with the on-device coach: the same src/ and res/ as ../build.sh, plus the ML Kit
// GenAI engine in src/main/kotlin. Debug build only, signed with the same local debug key as
// `DEBUG_BUILD=1 ./build.sh`, so it installs over that one and keeps its data. The Play build
// stays ../build.sh: the preview model only exists on phones in the AICore developer preview.
plugins { id 'com.android.application' }

android {
    namespace 'com.enftc.hrbuzz'
    compileSdk 37

    defaultConfig {
        applicationId 'com.enftc.hrbuzz'
        minSdk 31
        targetSdk 37
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '3')
        versionName System.getenv('VERSION_NAME') ?: '2.1'
    }

    sourceSets {
        main {
            // ../build.sh writes this copy of the manifest without its package attribute,
            // which AGP takes from `namespace` instead.
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['../../src', 'src/main/kotlin']
            res.srcDirs = ['../../res']
        }
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.cache/polar-hr-toolchain/hrbuzz-debug.keystore')
            storePassword 'android'
            keyAlias 'debug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta5'
}
